name: render
on:
  push:
    paths: ["jobs/**.json", "tools/**", ".github/workflows/render.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/vidcache
          key: rockstar-videos-v1
      - name: Setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow
          mkdir -p tools/fonts
          curl -sSL -o tools/fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf
          curl -sSL -o tools/fonts/Montserrat-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf"
      - name: Index official videos
        run: python tools/clips.py index
      - name: Build
        run: python tools/build.py
      - name: Commit outputs
        run: |
          git config user.name "gta6-render-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out index
          git diff --cached --quiet || (git commit -m "Render outputs" && git pull --rebase -q && git push)
