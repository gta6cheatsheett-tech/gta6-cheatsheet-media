name: render
on:
  push:
    paths: ["jobs/**.json", "tools/**", ".github/workflows/render.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-v2
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/vidcache
          key: rockstar-videos-v1
      - uses: FedericoCarboni/setup-ffmpeg@v3
        timeout-minutes: 5
      - name: Setup
        timeout-minutes: 5
        run: |
          pip install -q pillow
          mkdir -p tools/fonts
          curl -sSL --max-time 60 --retry 3 -o tools/fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf
          curl -sSL --max-time 60 --retry 3 -o tools/fonts/Montserrat-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf"
      - name: Build
        timeout-minutes: 8
        run: python tools/build.py
      - name: Index official videos
        timeout-minutes: 15
        continue-on-error: true
        run: python tools/clips.py index
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "gta6-render-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out index || true
          git diff --cached --quiet || (git commit -m "Render outputs" && git pull --rebase -q && git push)
